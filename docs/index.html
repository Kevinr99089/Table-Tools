  <style>
    :root{
      --paper:#f6f1e2;--paper-deep:#ece0c2;--card:#fffdf7;--ink:#242231;--muted:#726b58;
      --red:#c1392b;--red-soft:#e2685c;--gold:#d9a441;--ok:#3f7d4f;--wood:#8a6a4f;--line:#ddceaa;
      --font:"Fredoka",system-ui,sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;color:var(--ink);font-family:var(--font);font-weight:400;background-color:var(--paper);
      background-image:linear-gradient(90deg,transparent 30px,rgba(193,57,43,.32) 30px,rgba(193,57,43,.32) 31.5px,transparent 31.5px),
        linear-gradient(var(--line) 1px,transparent 1px);
      background-size:100% 100%,100% 30px;padding-bottom:90px;}
    .drawn{filter:url('#wiggle')}
    header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:2.5px solid var(--ink);padding:9px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 10px -6px rgba(36,34,49,.35)}
    .hbtn{background:var(--card);border:2.2px solid var(--ink);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;position:relative;box-shadow:2px 2px 0 var(--ink)}
    .hbtn:active{transform:translate(2px,2px);box-shadow:none}
    .hbtn.alert::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid var(--paper)}
    .logo-wrap{display:flex;align-items:center;gap:8px;min-width:0}
    .logo-text{font-weight:700;font-size:19px;transform:rotate(-1.5deg);white-space:nowrap;
      text-decoration:underline wavy var(--red-soft) 2px;text-underline-offset:5px}
    main{max-width:860px;margin:0 auto;padding:16px 15px}
    .cat-title{font-weight:700;font-size:22px;margin:10px 0 2px;
      text-decoration:underline wavy var(--red-soft) 2px;text-underline-offset:6px;display:inline-block}
    .cat-kicker{margin:0 0 12px;font-size:12px}
    .kicker{color:var(--muted);font-style:italic;text-align:center;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    @media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
    .card{position:relative;background:var(--card);border:2.4px solid var(--ink);border-radius:8px;padding:16px 12px 14px;
      display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:3px 3px 0 rgba(36,34,49,.16);cursor:pointer;text-align:center}
    .card::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-4deg);width:13px;height:13px;
      border-radius:50%;background:radial-gradient(circle at 35% 32%,#ff8072,var(--red));box-shadow:0 2px 3px rgba(0,0,0,.35)}
    .card:nth-child(3n+1){transform:rotate(-.7deg)}
    .card:nth-child(3n+2){transform:rotate(.5deg)}
    .card:nth-child(3n){transform:rotate(-.3deg)}
    .card:active{transform:scale(.97)}
    .card .ico{font-size:30px}
    .card .tit{font-weight:700;font-size:15px}
    .card .sub{font-size:11px;color:var(--muted);font-style:italic}
    .card.feature{flex-direction:row;text-align:left;justify-content:flex-start;padding:18px;gap:14px;transform:rotate(-.4deg)}
    .card.feature .ico{font-size:42px}
    .card.feature .tit{font-size:19px}
    .panel{background:var(--card);border:2.4px solid var(--ink);border-radius:10px;padding:14px;box-shadow:2px 2px 0 rgba(36,34,49,.16)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{flex:1;min-width:140px;padding:12px;background:var(--card);border:2.4px solid var(--ink);border-radius:9px;
      font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;box-shadow:2.5px 2.5px 0 var(--ink)}
    .btn:active{transform:translate(2px,2px);box-shadow:none}
    .btn.sec{border-style:dashed;box-shadow:none;opacity:.92}
    .btn.red{color:var(--red);border-color:var(--red)}
    .btn.confirming{background:var(--red);color:#fff;border-color:var(--red);border-style:solid;opacity:1;animation:confirmPulse .6s ease-in-out infinite alternate}
    @keyframes confirmPulse{from{opacity:1}to{opacity:.65}}
    input{background:transparent;border:none;border-bottom:1.5px dashed #b6a883;font-family:var(--font);font-size:16px;
      width:100%;text-align:center;color:var(--ink);user-select:text;border-radius:0;padding:2px 0}
    input:focus{outline:none;border-bottom:2px solid var(--ink);background:rgba(217,164,65,.12)}
    .paper-table{width:100%;border-collapse:collapse;background:var(--card);margin:12px 0}
    .paper-table th{border:2px solid var(--ink);background:var(--paper-deep);padding:6px;font-size:11px;text-transform:uppercase;font-weight:700}
    .paper-table td{border:2px solid var(--ink);padding:6px;text-align:center;height:36px;font-weight:700}
    .paper-table td.label{text-align:left;font-weight:700;background:rgba(236,224,194,.5);width:130px;font-size:12.5px}
    .belote-split{display:flex;border:3px solid var(--ink);height:290px;background:var(--card)}
    .belote-col{flex:1;display:flex;flex-direction:column;border-right:2px solid var(--ink)}
    .belote-col:last-child{border:none}
    .b-head{background:var(--paper-deep);padding:10px;text-align:center;font-weight:700;border-bottom:2px solid var(--ink);letter-spacing:1px}
    .b-tot{font-size:38px;text-align:center;padding:10px;font-weight:700;border-bottom:2px dashed var(--line)}
    .b-list{flex:1;overflow-y:auto;font-size:14px;text-align:center;line-height:1.8}
    .d3{display:flex;gap:12px;justify-content:center;align-items:center;margin:14px 0 6px}
    .d3-check{display:flex;gap:12px;justify-content:center;align-items:center;margin:4px 0}
    .die{width:72px;height:72px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:32px;
      font-weight:700;background:var(--card);box-shadow:3px 3px 0 rgba(36,34,49,.18)}
    .molkky-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
    .pin-btn{aspect-ratio:1;border:2.2px solid var(--wood);border-radius:50%;background:var(--card);color:var(--wood);
      font-weight:700;font-size:19px;display:grid;place-items:center;cursor:pointer}
    .pin-btn:active{background:var(--wood);color:#fff}
    .m-player{padding:10px;border:2.2px solid var(--ink);margin-bottom:10px;border-radius:9px;background:var(--card)}
    .m-player.active{border:3px solid var(--gold);background:#fbf1da}
    #alarmFlash{position:fixed;inset:0;z-index:500;pointer-events:none;opacity:0;background:var(--gold)}
    #alarmFlash.flashing{animation:alarmFlashKf .5s ease-in-out infinite}
    @keyframes alarmFlashKf{0%,100%{opacity:0}50%{opacity:.55}}
    .bac-big{width:126px;height:126px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-size:60px;
      font-family:var(--font);font-weight:700;background:var(--card);box-shadow:4px 4px 0 rgba(36,34,49,.2);margin:14px auto}
    .bac-grid{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin:14px 0}
    .bac-letter{height:25px;border:1px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:var(--font);font-weight:600;
      font-size:11px;background:var(--card);padding:0}
    .bac-letter.used{opacity:.35;text-decoration:line-through}
    .bac-letter.excluded{opacity:.2;border-style:dashed}
    .bac-letter.current{background:var(--red);color:#fff;border-color:var(--red)}
    .banner{position:sticky;top:56px;z-index:49;background:var(--card);border:1.8px dashed var(--red-soft);
      padding:5px 6px 5px 12px;border-radius:16px;box-shadow:1.5px 1.5px 0 rgba(36,34,49,.14);margin:8px 0;
      display:none;align-items:center;justify-content:space-between;gap:8px}
    .banner.show{display:flex}
    .banner span{font-size:11px;color:var(--muted)}
    .banner button{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--red);background:var(--card);
      color:var(--red);font-weight:700;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
    .banner button:active{transform:scale(.9)}
    #hgWrap{display:flex;justify-content:center;margin:12px 0}
    #hgCanvas{border:3px solid var(--ink);border-radius:4px;background:var(--card);box-shadow:3px 3px 0 rgba(36,34,49,.18);image-rendering:pixelated}
    @keyframes hgFlip{ from{transform:rotate(0deg)} to{transform:rotate(180deg)} }
    .hg-flip{animation:hgFlip .45s ease-in-out}
    .t-unit{display:flex;flex-direction:column;align-items:center;gap:6px}
    .t-val{font-weight:700;font-size:19px;min-width:40px;width:44px;text-align:center;background:transparent;border:none;font-family:var(--font);color:var(--ink)}
    .qbtn{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:2.3px solid var(--ink);background:var(--card);color:var(--ink);
      font-family:var(--font);font-weight:700;font-size:15px;line-height:1;cursor:pointer;box-shadow:2px 2px 0 var(--ink);padding:0}
    .qbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
    .modal-overlay{position:fixed;inset:0;z-index:6000;background:rgba(36,34,49,.55);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
    .modal-overlay.show{display:flex}
    .modal-box{background:var(--paper);border:3px solid var(--ink);border-radius:13px;max-width:480px;width:100%;margin-top:36px;padding:18px;box-shadow:5px 5px 0 var(--ink);font-size:14px}
    .switch{width:32px;height:32px;border:2.3px solid var(--ink);border-radius:7px;display:grid;place-items:center;background:var(--card);
      font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink);flex-shrink:0}
    .switch.on{background:var(--ok);color:#fff;border-color:var(--ok)}
    .switch:active{transform:translate(2px,2px);box-shadow:none}
    .settings-section{margin-bottom:16px;padding-bottom:14px;border-bottom:2px dashed var(--line)}
    .settings-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .settings-row:last-child{margin-bottom:0}
    .settings-label{font-weight:700;font-size:14px}
    .settings-desc{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
    .sound-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .sound-pills .btn{flex:none;min-width:0;padding:8px 12px;font-size:13px}
    input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:var(--paper-deep);border:1.5px solid var(--ink);margin-top:8px}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--red);border:2px solid var(--ink);cursor:pointer}
    input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--red);border:2px solid var(--ink);cursor:pointer}
    video{position:absolute;top:0;left:0;width:1px;height:1px;opacity:.01;pointer-events:none}
  </style>
</head>
<body>
  <noscript>
    <div style="padding:16px;font-family:system-ui;background:#fff;border:2px solid #000;margin:12px;border-radius:10px">
      JavaScript est nécessaire pour faire fonctionner Table Tools, veuillez activer JavaScript ou créez une exception pour pouvoir utiliser cet outil.
      <br>JavaScript is required to run Table Tools — please enable JavaScript or add an exception to use this tool.
    </div>
  </noscript>
  <svg width="0" height="0" style="position:absolute">
    <filter id="wiggle">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </svg>
  <video id="hackVid" playsinline loop muted>
    <source src="data:video/mp4;base64,AAAAHGZ0eXBNUjRCAAAARU1SNIgAAABhYXJrdWR0YQAAAAxjb3ZlYXJrdWR0YQlmcm9tAAAAGHNvaWFhcnR3cmvDq2xpYnF1aWNrY2hhdAAAAAxtZGF0AAAAAAAAAAAAAA==" type="video/mp4">
  </video>
  <div id="appWrap">
    <header>
      <button id="backBtn" class="hbtn drawn" title="Retour">←</button>
      <div class="logo-wrap">
        <svg viewBox="0 0 32 32" width="30" height="30" class="drawn" style="flex-shrink:0">
          <rect x="5" y="3" width="17" height="25" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
          <circle cx="5" cy="7" r="1.4" fill="var(--ink)"/>
          <circle cx="5" cy="13" r="1.4" fill="var(--ink)"/>
          <circle cx="5" cy="19" r="1.4" fill="var(--ink)"/>
          <circle cx="5" cy="25" r="1.4" fill="var(--ink)"/>
          <line x1="9" y1="9" x2="18" y2="9" stroke="var(--muted)" stroke-width="1.5"/>
          <line x1="9" y1="14" x2="18" y2="14" stroke="var(--muted)" stroke-width="1.5"/>
          <line x1="9" y1="19" x2="15" y2="19" stroke="var(--muted)" stroke-width="1.5"/>
          <path d="M17 26 L27 10 L30 12 L20 28 Z" fill="var(--red)" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">TableTools</span>
      </div>
      <div style="flex:1"></div>
      <button id="settingsBtn" class="hbtn drawn" title="Réglages">⚙</button>
      <button id="homeBtn" class="hbtn drawn" title="Accueil">⌂</button>
    </header>
    <main>
      <div id="banner" class="banner drawn">
        <span id="bannerLost">anti‑veille / plein écran désactivé</span>
        <button id="bannerFix" title="Réactiver">↻</button>
      </div>
      <div id="app"></div>
    </main>
  </div>
  <div id="alarmFlash"></div>
  <div id="rulesModal" class="modal-overlay">
    <div class="modal-box drawn">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
        <div id="rulesTitle" style="font-weight:700;font-size:20px"></div>
        <button id="rulesClose" class="qbtn" title="Fermer">✕</button>
      </div>
      <div id="rulesBody"></div>
    </div>
  </div>
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-box drawn">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">
        <div id="settingsTitle" style="font-weight:700;font-size:22px"></div>
        <button id="settingsClose" class="qbtn" title="Fermer">✕</button>
      </div>
      <div id="settingsBody"></div>
    </div>
  </div>
<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const app = $("#app");
  const vid = $("#hackVid");
  const banner   = $("#banner");
  const bannerFix= $("#bannerFix");
  const backBtn  = $("#backBtn");
  const homeBtn  = $("#homeBtn");
  const settingsBtn = $("#settingsBtn");
  const alarmFlashEl = $("#alarmFlash");
  const PREF_WAKE = "tt15_pref_wake";
  const PREF_FS   = "tt15_pref_fs";
  const PREF_SOUND = "tt15_pref_sound";
  const PREF_VOLUME = "tt15_pref_volume";
  const PREF_FLASH = "tt15_pref_flash";
  const PREF_VIBRATE = "tt15_pref_vibrate";
  const PREF_CUSTOM_DATA = "tt15_pref_customsound_data";
  const PREF_CUSTOM_NAME = "tt15_pref_customsound_name";
  const loadPref=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:(v==="1");}catch(e){return d;}};
  const savePref=(k,v)=>{try{localStorage.setItem(k,v?"1":"0");}catch(e){}};
  const loadStr=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}};
  const saveStr=(k,v)=>{try{ if(v===null||v===undefined) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return false; } return true;};
  let wantWake = loadPref(PREF_WAKE, true);
  let wantFS   = loadPref(PREF_FS, true);
  let wakeLock = null;
  let keepAliveTimer = null;
  let wakeActive = false, fsActive = false;
  let settings = {
    sound: loadStr(PREF_SOUND, "cloche"),
    volume: Number(loadStr(PREF_VOLUME, "80")) || 80,
    flash: loadPref(PREF_FLASH, true),
    vibrate: loadPref(PREF_VIBRATE, true),
    customData: loadStr(PREF_CUSTOM_DATA, null),
    customName: loadStr(PREF_CUSTOM_NAME, null)
  };
  function updateGearBadge(){
    const degraded = (wantWake && !wakeActive) || (wantFS && !fsActive);
    if(settingsBtn) settingsBtn.classList.toggle("alert", !!degraded);
  }
  function refreshSettingsBody(){
    const m = $("#settingsModal");
    if(m && m.classList.contains("show")) renderSettingsBody();
  }
  function setWakeUI(on){ wakeActive = !!on; updateGearBadge(); refreshSettingsBody(); }
  function setFSUI(on){ fsActive = !!on; updateGearBadge(); refreshSettingsBody(); }
  const load=(k,d)=>{try{ return JSON.parse(localStorage.getItem("tt15_"+k)) || d; }catch(e){ return d; }};
  const save=(k,v)=>{ try{ localStorage.setItem("tt15_"+k, JSON.stringify(v)); }catch(e){} };
  const esc=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  const SYS_LANG = ((navigator.language || navigator.userLanguage || "fr") + "").toLowerCase();
  const LANG = SYS_LANG.startsWith("fr") ? "fr" : "en";
  document.documentElement.lang = LANG;
  const I18N = {
    nav_back:{fr:"Retour",en:"Back"},
    nav_settings:{fr:"Réglages",en:"Settings"},
    nav_home:{fr:"Accueil",en:"Home"},
    nav_close:{fr:"Fermer",en:"Close"},
    nav_rules:{fr:"Règles du jeu",en:"Game rules"},
    banner_lost:{fr:"anti-veille / plein écran désactivé",en:"keep-awake / fullscreen is off"},
    banner_btn:{fr:"Réactiver",en:"Re-enable"},
    confirm_tap_again:{fr:"Sûr ?",en:"Sure?"},
    sheet_remove_player:{fr:"− Joueur",en:"− Player"},
    cat_score_t:{fr:"Jeux à score",en:"Score games"},
    cat_score_s:{fr:"Cartes, dés, tuiles : on compte, on tient les comptes.",en:"Cards, dice, tiles: keeping the tally."},
    cat_bac_t:{fr:"Le jeu du Bac",en:"Categories game"},
    cat_free_t:{fr:"Feuilles libres",en:"Free sheets"},
    cat_free_s:{fr:"Pour les jeux sans grille toute faite.",en:"For games without a ready-made sheet."},
    cat_tools_t:{fr:"Outils",en:"Tools"},
    cat_tools_s:{fr:"Un dé, un sablier, sous la main.",en:"A die, a timer, close at hand."},
    g_belote_t:{fr:"Belote",en:"Belote"}, g_belote_s:{fr:"Nous / Eux",en:"Us / Them"},
    g_yams_t:{fr:"Yams",en:"Yams"}, g_yams_s:{fr:"Feuille + bonus auto",en:"Sheet + auto bonus"},
    g_tarot_t:{fr:"Tarot",en:"Tarot"}, g_tarot_s:{fr:"Contrat + scores",en:"Contract + scores"},

  function t(key){ const e=I18N[key]; if(!e) return key; return e[LANG]||e.fr||key; }
  function turnOf(name){ return LANG==="fr" ? ("Tour de "+name) : (name+"'s turn"); }
  function armConfirm(btn, action){
    if(!btn) return;
    if(btn.dataset.armed==="1"){
      clearTimeout(Number(btn.dataset.armTimer));
      delete btn.dataset.armed;
      btn.textContent = btn.dataset.label;
      btn.classList.remove("confirming");
      action();
      return;
    }
    btn.dataset.label = btn.textContent;
    btn.dataset.armed = "1";
    btn.textContent = t('confirm_tap_again');
    btn.classList.add("confirming");
    const tm = setTimeout(()=>{
      delete btn.dataset.armed;
      btn.textContent = btn.dataset.label;
      btn.classList.remove("confirming");
    }, 2500);
    btn.dataset.armTimer = String(tm);
  }

  function sfxVol(){ return Math.max(0, Math.min(1, settings.volume/100)); }
  function ding(){
    const c=unlockAudioCtx(); if(!c) return;
    const v=sfxVol(); if(v<=0.001) return;
    const tm=c.currentTime;
    const o=c.createOscillator(); const g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.setValueAtTime(1200,tm);
    g.gain.linearRampToValueAtTime(0.5*v,tm+0.01);
    g.gain.exponentialRampToValueAtTime(0.01*v,tm+1.2);
    o.start(tm); o.stop(tm+1.2);
  }
  let noiseBufPool=null;
  function getNoiseBuf(c){
    if(!noiseBufPool){
      noiseBufPool=[];
      for(let k=0;k<6;k++){
        const dur=0.018+Math.random()*0.02;
        const size=Math.max(1,Math.floor(c.sampleRate*dur));
        const buf=c.createBuffer(1,size,c.sampleRate);
        const data=buf.getChannelData(0);
        for(let j=0;j<size;j++) data[j]=(Math.random()*2-1)*Math.pow(1-j/size,1.6);
        noiseBufPool.push(buf);
      }
    }
    return noiseBufPool[Math.floor(Math.random()*noiseBufPool.length)];
  }
  function diceClack(){
    const c=unlockAudioCtx(); if(!c) return;
    const v=sfxVol(); if(v<=0.001) return;
    const n=9+Math.floor(Math.random()*4);
    let tm=c.currentTime+0.005;
    for(let i=0;i<n;i++){
      const buf=getNoiseBuf(c);
      const noise=c.createBufferSource(); noise.buffer=buf;
      const bp=c.createBiquadFilter();
      bp.type="bandpass";
      bp.frequency.value = i<2 ? (1000+Math.random()*300) : (2300+Math.random()*650);
      bp.Q.value=0.9+Math.random()*0.7;
      const g=c.createGain();
      const trend=1-0.5*(i/(n-1));
      const jitter=0.4+Math.random()*0.6;
      g.gain.setValueAtTime(0.55*trend*jitter*v,tm);
      noise.connect(bp); bp.connect(g); g.connect(c.destination);
      noise.start(tm); noise.stop(tm+buf.duration);
      tm += 0.014+Math.random()*0.045;
    }
  }
  function soundBell(v){
    const c=unlockAudioCtx(); if(!c) return;
    const pulseDur=0.045, pulseGap=0.01, ringPulses=14, ringGap=0.32, rings=3;
    let tm=c.currentTime+0.03;
    for(let r=0; r<rings; r++){
      for(let i=0;i<ringPulses;i++){
        const o=c.createOscillator(); const g=c.createGain();
        o.type="triangle";
        o.connect(g); g.connect(c.destination);
        o.frequency.setValueAtTime(i%2===0 ? 1000 : 1122, tm);
        g.gain.setValueAtTime(0.0001, tm);
        g.gain.linearRampToValueAtTime(0.5*v, tm+0.008);
        g.gain.setValueAtTime(0.5*v, tm+pulseDur-0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, tm+pulseDur);
        o.start(tm); o.stop(tm+pulseDur+0.01);
        tm += pulseDur+pulseGap;
      }
      tm += ringGap;
    }
  }
  function soundWhistle(v){
    const c=unlockAudioCtx(); if(!c) return;
    let tm=c.currentTime+0.02;
    for(let i=0;i<2;i++){
      const o=c.createOscillator(); const g=c.createGain();
      o.type="sine"; o.connect(g); g.connect(c.destination);
      o.frequency.setValueAtTime(650,tm);
      o.frequency.exponentialRampToValueAtTime(1500,tm+0.45);
      g.gain.setValueAtTime(0.0001,tm);
      g.gain.linearRampToValueAtTime(0.55*v,tm+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,tm+0.5);
      o.start(tm); o.stop(tm+0.55);
      tm+=0.65;
    }

  function soundDrum(v){
    const c=unlockAudioCtx(); if(!c) return;
    let tm=c.currentTime+0.02;
    for(let i=0;i<4;i++){
      const o=c.createOscillator(); const og=c.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(170,tm);
      o.frequency.exponentialRampToValueAtTime(48,tm+0.15);
      og.gain.setValueAtTime(0.001,tm);
      og.gain.linearRampToValueAtTime(1*v,tm+0.006);
      og.gain.exponentialRampToValueAtTime(0.001,tm+0.34);
      o.connect(og); og.connect(c.destination);

      const buf=getNoiseBuf(c);
      const click=c.createBufferSource(); click.buffer=buf;
      const cg=c.createGain();

  function formatTime(total){
    total = Math.max(0, total);
    const h=Math.floor(total/3600), m=Math.floor((total%3600)/60), s=total%60;
    const mm=String(m).padStart(2,"0"), ss=String(s).padStart(2,"0");
    return h>0 ? (h+":"+mm+":"+ss) : (mm+":"+ss);
  }
  function adjustTime(unit, dir){
    let h=Math.floor(tS.t/3600), rem=tS.t%3600, m=Math.floor(rem/60), s=rem%60;
    if(unit==="h") h=Math.max(0,Math.min(23,h+dir));
    if(unit==="m") m=Math.max(0,Math.min(59,m+dir));
    if(unit==="s") s=Math.max(0,Math.min(59,s+dir));
    stopTimer();
    tS.t = h*3600+m*60+s;
    tS.r = tS.t;
    render();
  }
  const HG_COLS=18, HG_ROWS=30, HG_CELL=7;
  const HG_WIDE=[2,15], HG_NARROW=[8,9];
  function hgRowBounds(i, n, reverse){
    const f = n<=1 ? 0 : i/(n-1);
    const a = reverse ? HG_NARROW : HG_WIDE;
    const b = reverse ? HG_WIDE : HG_NARROW;
    return { left: Math.round(a[0] + (b[0]-a[0])*f), right: Math.round(a[1] + (b[1]-a[1])*f) };
  }
  function drawHourglass(){
    const cv = $("#hgCanvas");
    if(!cv) return;
    const ctx = cv.getContext("2d");
    ctx.clearRect(0,0,cv.width,cv.height);
    const px = (col,row,color)=>{ ctx.fillStyle=color; ctx.fillRect(col*HG_CELL,row*HG_CELL,HG_CELL,HG_CELL); };
    const INK="#242231", WOOD="#8a6a4f", SAND="#d9a441", GLASS="#f6f1e2";
    const frac = tS.t>0 ? Math.max(0,Math.min(1, tS.r/tS.t)) : 0;
    const atRest = !tS.run && tS.r>=tS.t;
    for(let c=0;c<HG_COLS;c++){ px(c,0,WOOD); px(c,1,WOOD); px(c,HG_ROWS-2,WOOD); px(c,HG_ROWS-1,WOOD); }
    const topN=12, botN=12, topStart=2, neckStart=14, botStart=16;
    const fillTop = atRest ? 0 : Math.round(topN * frac);
    const fillBot = atRest ? botN : Math.round(botN * (1-frac));
    for(let i=0;i<topN;i++){
      const row = topStart+i;
      const {left,right} = hgRowBounds(i, topN, false);
      px(left,row,INK); px(right,row,INK);
      const isSand = i >= (topN - fillTop);
      for(let c=left+1;c<right;c++) px(c,row, isSand ? SAND : GLASS);
    }
    for(let row=neckStart; row<neckStart+2; row++){
      px(HG_NARROW[0],row,INK); px(HG_NARROW[1],row,INK);
      for(let c=HG_NARROW[0]+1;c<HG_NARROW[1];c++) px(c,row,GLASS);
    }
    if(tS.run && frac>0 && frac<1){
      const gRow = neckStart + (hgPhase%2);
      px(HG_NARROW[0]+1, gRow, SAND);
    }
    for(let i=0;i<botN;i++){
      const row = botStart+i;
      const {left,right} = hgRowBounds(i, botN, true);
      px(left,row,INK); px(right,row,INK);
      const isSand = i >= (botN - fillBot);
      for(let c=left+1;c<right;c++) px(c,row, isSand ? SAND : GLASS);
    }
  }
  function beginRun(){
    tS.run=true;
    tInt=setInterval(()=>{
      tS.r--;
      if(tS.r<=0){ tS.r=0; stopTimer(); drawHourglass(); triggerAlarm(); updateTimerText(); return; }
      updateTimerText();
    }, 1000);
    hgInt=setInterval(()=>{ hgPhase++; drawHourglass(); }, 180);
    updateTimerText();
  }
  function updateTimerText(){
    const el=$("#tTime"); if(el) el.textContent = formatTime(tS.r);
    const btn=$("#tStart"); if(btn) btn.textContent = tS.run ? t('timer_pause') : t('timer_start');
  }
  function rTimer(){
    const H=Math.floor(tS.t/3600), Mrem=tS.t%3600, M=Math.floor(Mrem/60), S=Mrem%60;
    app.innerHTML = '<div class="panel drawn" style="text-align:center">'
      + '<div style="font-weight:700;font-size:18px">'+t('t_timer_t')+'</div>'
      + '<div id="hgWrap"><canvas id="hgCanvas" width="'+(HG_COLS*HG_CELL)+'" height="'+(HG_ROWS*HG_CELL)+'"></canvas></div>'
      + '<div id="tTime" style="font-weight:700;font-size:40px">'+formatTime(tS.r)+'</div>'
      + '<div class="actions"><button class="btn" id="tStart">'+(tS.run?t('timer_pause'):t('timer_start'))+'</button><button class="btn sec" id="tReset">'+t('timer_reset_btn')+'</button></div>'
      + '</div>'
      + '<div class="panel drawn" style="margin-top:14px">'
      + '<div class="kicker" style="text-align:center">'+t('timer_manual_kicker')+'</div>'
      + '<div style="display:flex;justify-content:center;gap:18px;margin-top:6px">'
      +   ['h','m','s'].map(u=>{
            const label = u==="h"?t('timer_h'):(u==="m"?t('timer_min'):t('timer_sec'));
            const val = u==="h"?H:(u==="m"?M:S);
            return '<div class="t-unit">'
              + '<button class="qbtn" data-unit="'+u+'" data-dir="1">+</button>'
              + '<input class="t-val" id="t'+u.toUpperCase()+'Input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="'+String(val).padStart(2,"0")+'">'
              + '<div style="font-size:10px;color:var(--muted);font-weight:700">'+label+'</div>'
              + '<button class="qbtn" data-unit="'+u+'" data-dir="-1">−</button>'
              + '</div>';
          }).join("")
      + '</div>'
      + '</div>';
    drawHourglass();
    $("#tStart").addEventListener("click", ()=>{
      if(tS.run){ stopTimer(); updateTimerText(); return; }
      if(tS.t<=0) return;
      const fresh = tS.r>=tS.t || tS.r<=0;
      if(fresh){
        const cv=$("#hgCanvas");
        let done=false;
        const finish=()=>{
          if(done) return; done=true;
          cv.classList.remove("hg-flip");
          tS.r=tS.t;
          beginRun();
          drawHourglass();
        };
        cv.classList.add("hg-flip");
        cv.addEventListener("animationend", finish, {once:true});
        setTimeout(finish, 500);
      }else{
        beginRun();
      }
    });
    $("#tReset").addEventListener("click", ()=>{ stopTimer(); tS.r=tS.t; render(); });
    app.querySelectorAll("[data-unit]").forEach(b=> b.addEventListener("click", ()=>{ adjustTime(b.getAttribute("data-unit"), Number(b.getAttribute("data-dir"))); }) );
    const tHInput=$("#tHInput"), tMInput=$("#tMInput"), tSInput=$("#tSInput");
    function finalizeTimerInputs(){
      let h=parseInt(tHInput.value,10); if(isNaN(h)) h=0;
      let m=parseInt(tMInput.value,10); if(isNaN(m)) m=0;
      let s=parseInt(tSInput.value,10); if(isNaN(s)) s=0;
      h=Math.max(0,Math.min(23,h)); m=Math.max(0,Math.min(59,m)); s=Math.max(0,Math.min(59,s));
      stopTimer();
      tS.t = h*3600+m*60+s;
      tS.r = tS.t;
      render();
    }
    [tHInput,tMInput,tSInput].forEach(inp=>{
      inp.addEventListener("focus", ()=> inp.select());
      inp.addEventListener("input", ()=>{ inp.value = inp.value.replace(/[^0-9]/g,"").slice(0,2); });
      inp.addEventListener("blur", finalizeTimerInputs);
      inp.addEventListener("keydown", e=>{ if(e.key==="Enter") inp.blur(); });
    });
  }
  const BAC_ALL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const BAC_HARD = ["Q","U","W","X","Y","Z"];
  const BAC_MAX_DURATION = 600;
  function bacPool(d){ return BAC_ALL.filter(l=> !(d.excludeHard && BAC_HARD.includes(l))); }
  let bacInt=null;
  let bacTS={t:60,r:60,run:false};
  let bacPreInt=null, bacPreVal=0;
  function stopBacTimer(){ if(bacInt){ clearInterval(bacInt); bacInt=null; } bacTS.run=false; }
  function stopBacPre(){ if(bacPreInt){ clearInterval(bacPreInt); bacPreInt=null; } bacPreVal=0; }
  function updateBacTimerText(){
    const el=$("#bacTime"); if(el) el.textContent = formatTime(bacTS.r);
    const btn=$("#bacStart"); if(btn) btn.textContent = bacTS.run ? t('timer_pause') : t('timer_start');
  }
  function beginBacRun(){
    bacTS.run=true;
    bacInt=setInterval(()=>{
      bacTS.r--;
      if(bacTS.r<=0){ bacTS.r=0; stopBacTimer(); triggerAlarm(); updateBacTimerText(); return; }
      updateBacTimerText();
    }, 1000);
    updateBacTimerText();
  }
  function setBacDuration(d, m, s){
    m = Math.max(0, Math.min(10, isNaN(m)?0:Math.trunc(m)));
    s = Math.max(0, Math.min(59, isNaN(s)?0:Math.trunc(s)));
    if(m>=10){ m=10; s=0; }
    d.duration = m*60+s;
    save("bac", d);
    stopBacTimer(); stopBacPre();
    bacTS.t=d.duration; bacTS.r=d.duration;
  }
  function adjustBacDuration(d, unit, dir){
    let m = Math.floor(d.duration/60), s = d.duration%60;
    if(unit==="m") m += dir;
    if(unit==="s") s += dir;
    setBacDuration(d, m, s);
    render();
  }
  function startBacCountdown(d){
    if(d.duration<=0) return;
    stopBacTimer(); stopBacPre();
    bacTS.t=d.duration; bacTS.r=d.duration;
    bacPreVal=3;
    render();
    bacPreInt=setInterval(()=>{
      bacPreVal--;
      if(bacPreVal<=0){
        clearInterval(bacPreInt); bacPreInt=null; bacPreVal=0;
        beginBacRun();
        render();
      }else{
        render();
      }
    }, 1000);
  }
  function rBac(){
    const d = load("bac", {excludeHard:true, duration:60, used:[], current:null});
    if(!Array.isArray(d.used)) d.used=[];
    if(typeof d.duration!=="number" || d.duration<0 || d.duration>BAC_MAX_DURATION) d.duration=60;
    if(!bacTS.run && !bacPreVal && bacTS.t!==d.duration){ bacTS.t=d.duration; bacTS.r=d.duration; }
    const pool = bacPool(d);
    const grid = BAC_ALL.map(l=>{
      const excluded = d.excludeHard && BAC_HARD.includes(l);
      const used = !excluded && d.used.includes(l);
      const current = d.current===l;
      let cls = "bac-letter" + (current?" current":(excluded?" excluded":(used?" used":"")));
      return '<div class="'+cls+'">'+l+'</div>';
    }).join("");
    const durM = Math.floor(d.duration/60), durS = d.duration%60;
    const timerZone = bacPreVal>0
      ? `
        <div style="font-weight:700;font-size:18px">${t('bac_announce')}</div>
        <div style="font-weight:700;font-size:56px;margin:10px 0;color:var(--red)">${bacPreVal}</div>
        <div class="kicker">${t('bac_starts_after')}</div>
      `
      : `
        <div style="font-weight:700;font-size:18px">${t('bac_round_timer')}</div>
        <div id="bacTime" style="font-weight:700;font-size:40px;margin:10px 0">${formatTime(bacTS.r)}</div>
        <div class="actions" style="justify-content:center">
          <button class="btn" id="bacStart">${bacTS.run?t('timer_pause'):t('timer_start')}</button>
          <button class="btn sec" id="bacReset">${t('timer_reset_btn')}</button>
        </div>
        <div class="kicker" style="margin-top:10px">${t('bac_set_time_kicker')}</div>
        <div style="display:flex;justify-content:center;gap:22px;margin-top:6px">
          <div class="t-unit">
            <button class="qbtn" data-bacunit="m" data-bacdir="1">+</button>
            <input class="t-val" id="bacMinInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${String(durM).padStart(2,"0")}">
            <div style="font-size:10px;color:var(--muted);font-weight:700">${t('timer_min')}</div>
            <button class="qbtn" data-bacunit="m" data-bacdir="-1">−</button>
          </div>
          <div class="t-unit">
            <button class="qbtn" data-bacunit="s" data-bacdir="1">+</button>
            <input class="t-val" id="bacSecInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${String(durS).padStart(2,"0")}">
            <div style="font-size:10px;color:var(--muted);font-weight:700">${t('timer_sec')}</div>
            <button class="qbtn" data-bacunit="s" data-bacdir="-1">−</button>
          </div>
        </div>
      `;
    app.innerHTML = `
      <div class="panel drawn" style="text-align:center">
        <div style="display:flex;gap:8px;align-items:center;justify-content:center">
          <div style="font-weight:700;font-size:18px">${t('g_bac_t')}</div>
          ${qbtn("bac")}
        </div>
        <div class="kicker">${t('bac_kicker')}</div>
        <div class="bac-big drawn" id="bacLetter">${d.current || "?"}</div>
        <div class="actions" style="justify-content:center">
          <button class="btn" id="bacDraw">${t('bac_draw_btn')}</button>
        </div>
        <div style="text-align:center;margin-top:12px">
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:11px">
            <input type="checkbox" id="bacHard" ${d.excludeHard?"checked":""}>
            <span>${t('bac_hard_label')}</span>
          </label>
        </div>
        <div class="bac-grid">${grid}</div>
        <div class="actions">
          <button class="btn sec" id="bacUsedReset">${t('bac_clear_btn')}</button>
        </div>
      </div>
      <div class="panel drawn" style="margin-top:14px;text-align:center">
        ${timerZone}
      </div>
    `;
    $("#bacDraw").addEventListener("click", ()=>{
      const p = bacPool(d);
      if(p.length===0) return;
      let avail = p.filter(l=> !d.used.includes(l));
      if(avail.length===0) avail = p.slice();
      const finalLetter = avail[Math.floor(Math.random()*avail.length)];
      diceClack();
      const el = $("#bacLetter");
      let i=0, last=null;
      function frame(now){
        if(last===null) last=now;
        if(now-last>=50){
          el.textContent = p[Math.floor(Math.random()*p.length)];
          last=now; i++;
        }
        if(i<11) requestAnimationFrame(frame);
        else{
          if(p.every(l=> d.used.includes(l))) d.used=[];
          if(!d.used.includes(finalLetter)) d.used.push(finalLetter);
          d.current = finalLetter;
          save("bac", d);
          startBacCountdown(d);
        }
      }
      requestAnimationFrame(frame);
    });
    $("#bacHard").addEventListener("change", (e)=>{ d.excludeHard = e.target.checked; save("bac", d); render(); });
    $("#bacUsedReset").addEventListener("click", ()=>{ d.used=[]; d.current=null; save("bac", d); render(); });
    if(bacPreVal<=0){
      $("#bacStart").addEventListener("click", ()=>{
        if(bacTS.run){ stopBacTimer(); updateBacTimerText(); return; }
        if(bacTS.t<=0) return;
        if(bacTS.r>=bacTS.t || bacTS.r<=0) bacTS.r = bacTS.t;
        beginBacRun();
      });
      $("#bacReset").addEventListener("click", ()=>{ stopBacTimer(); stopBacPre(); bacTS.r=bacTS.t; updateBacTimerText(); });
      app.querySelectorAll("[data-bacunit]").forEach(b=> b.addEventListener("click", ()=>{
        adjustBacDuration(d, b.getAttribute("data-bacunit"), Number(b.getAttribute("data-bacdir")));
      }));
      const bacMinInput = $("#bacMinInput"), bacSecInput = $("#bacSecInput");
      function finalizeBacInputs(){
        let m = parseInt(bacMinInput.value,10); if(isNaN(m)) m=0;
        let s = parseInt(bacSecInput.value,10); if(isNaN(s)) s=0;
        setBacDuration(d, m, s);
        render();
      }
      bacMinInput.addEventListener("focus", ()=> bacMinInput.select());
      bacMinInput.addEventListener("input", ()=>{
        let v = bacMinInput.value.replace(/[^0-9]/g,"");
        v = (v.length>0 && v[0]!=="1") ? v.slice(0,1) : v.slice(0,2);
        bacMinInput.value = v;
      });
      bacMinInput.addEventListener("blur", finalizeBacInputs);
      bacMinInput.addEventListener("keydown", e=>{ if(e.key==="Enter") bacMinInput.blur(); });
      bacSecInput.addEventListener("focus", ()=> bacSecInput.select());
      bacSecInput.addEventListener("input", ()=>{
        bacSecInput.value = bacSecInput.value.replace(/[^0-9]/g,"").slice(0,2);
      });
      bacSecInput.addEventListener("blur", finalizeBacInputs);
      bacSecInput.addEventListener("keydown", e=>{ if(e.key==="Enter") bacSecInput.blur(); });
    }
  }
  function rCustom(){
    const cfg = load("custom_cfg",{title:t('custom_default_title'), players:4, rounds:5});
    app.innerHTML = `
      <div class="panel drawn">
        <div style="font-weight:700;font-size:18px">${t('g_custom_t')}</div>
        <div class="kicker">${t('custom_kicker')}</div>
        <div class="actions" style="margin-top:10px">
          <div style="flex:1;min-width:160px"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${t('custom_title_label')}</div><input id="ctTitle" value="${esc(cfg.title)}"></div>
          <div style="flex:1;min-width:120px"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${t('custom_players_label')}</div><input id="ctPlayers" type="number" min="1" max="12" value="${cfg.players}"></div>
          <div style="flex:1;min-width:120px"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${t('custom_rounds_label')}</div><input id="ctRounds" type="number" min="1" max="30" value="${cfg.rounds}"></div>
        </div>
        <div class="actions">
          <button class="btn" id="ctGo">${t('custom_generate_btn')}</button>
          <button class="btn sec red" id="ctReset">${t('custom_reset_sheet_btn')}</button>
        </div>
      </div>
    `;
    function saveCfg(){
      cfg.title=$("#ctTitle").value||t('custom_default_title');
      cfg.players=Math.max(1,Math.min(12,Number($("#ctPlayers").value)||4));
      cfg.rounds=Math.max(1,Math.min(30,Number($("#ctRounds").value)||5));
      save("custom_cfg",cfg);
    }
    $("#ctTitle").addEventListener("input", saveCfg);
    $("#ctPlayers").addEventListener("input", saveCfg);
    $("#ctRounds").addEventListener("input", saveCfg);
    $("#ctGo").addEventListener("click", ()=>{
      saveCfg();
      const ps=Array.from({length:cfg.players},(_,i)=>"J"+(i+1));
      const r=Array.from({length:cfg.rounds},()=>({k:"", s:new Array(cfg.players).fill(0)}));
      save("custom_sheet",{ps:ps, r:r, meta:{date:"", title:cfg.title}});
      nav("#custom_sheet");
    });
    $("#ctReset").addEventListener("click", (e)=> armConfirm(e.currentTarget, ()=>{ save("custom_sheet",{ps:["J1","J2"], r:[], meta:{date:"", title:t('custom_default_title')}}); }));
  }
  function rCustomSheet(){
    const d = load("custom_sheet",{ps:["J1","J2"], r:[], meta:{date:""}});
    renderSheet("custom_sheet", (d.meta && d.meta.title) ? d.meta.title : t('custom_default_title'), {defaultPlayers:d.ps, addRoundLabel:t('sheet_add_round')});
  }
  function render(){
    const h = currentView || "#home";
    if(h==="#home"){ backBtn.style.visibility="hidden"; homeBtn.disabled=true; }
    else{ backBtn.style.visibility="visible"; homeBtn.disabled=false; }
    if(h!=="#timer") stopTimer();
    if(h!=="#bac"){ stopBacTimer(); stopBacPre(); }
    showBanner(false);
    switch(h){
      case "#home": rHome(); break;
      case "#belote": rBelote(); break;
      case "#yams": rYams(); break;
      case "#tarot": rTarot(); break;
      case "#rami": rRami(); break;
      case "#uno": rUno(); break;
      case "#scrabble": rScrabble(); break;
      case "#free": rFree(); break;
      case "#skyjo": rSkyjo(); break;
      case "#bac": rBac(); break;
      case "#victoires": rVictoires(); break;
      case "#molkky": rMolkky(); break;
      case "#dice": rDice(); break;
      case "#timer": rTimer(); break;
      case "#custom": rCustom(); break;
      case "#custom_sheet": rCustomSheet(); break;
      default: rHome();
    }
  }
  applyStaticI18N();
  updateGearBadge();
  boot();
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
